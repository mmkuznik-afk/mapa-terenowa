<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3B6D11">
<title>Mapa terenowa</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="ikona-192.png"><link rel="apple-touch-icon" href="ikona-192.png">
<!--
  Mapa terenowa z paczki mLasa — wersja na telefon. Powstała 2026-11-03 z mapy przenośnej (mapa-przenosna.html):
  czytnik ZIP/SQLite/SHP i karta wydzielenia przeniesione 1:1. Bez internetu, nic nie wysyła.
  Robi trzy rzeczy: koloruje zabiegi z planu na wybrany rok, pokazuje pozycję z GPS (WGS84 → PL-1992, EPSG:2180)
  i po dotknięciu wydzielenia otwiera opis taksacyjny. Ostatnia paczka zostaje w pamięci przeglądarki (IndexedDB).
  Od 2026-11-03 (wieczór): pomiar długości i powierzchni (📏), zapis własnych punktów/linii/powierzchni z eksportem
  GeoJSON/KML oraz warstwy z plików (SHP w ZIP, KML/KMZ, GPX, GeoJSON; WGS84, PL-1992, PL-2000) — wszystko w IndexedDB.
-->
<style>
:root{--bg:#e9e7e0;--card:#fbfaf6;--ink:#23231f;--mute:#6b6a63;--line:#dcd9ce;--acc:#3B6D11;--acc-bg:#EAF3DE;--on-acc:#fff;--hot:#f6f1dc}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151514;--card:#232321;--ink:#ecebe5;--mute:#a3a29b;--line:#3a3a36;--acc:#97C459;--acc-bg:#1f3109;--on-acc:#161614;--hot:#2e2a1c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.main{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:600}
.drop{max-width:560px;margin:10vh 16px;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:22px}
@media (min-width:600px){.drop{margin:10vh auto}}
.drop h1{margin:0 0 8px;font-size:22px}
.nota{color:var(--mute);font-size:13px;margin:6px 0}
.err{background:#fcebeb;color:#791f1f;border-radius:8px;padding:8px 12px;margin-top:12px}
/* mapa na cały ekran */
#mapa{position:fixed;inset:0;background:#fbfbf7;touch-action:none;-webkit-user-select:none;user-select:none;color-scheme:light}
#mapa svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.w{fill:transparent;stroke:#a19f94;stroke-width:.7}
.w.plan{fill-opacity:.3;stroke-width:2.2}
.w.wyk{fill-opacity:.82;stroke:#333;stroke-width:.9}
.oddz{fill:none;stroke:#444;stroke-width:1.6}
.les{fill:none;stroke:#111;stroke-width:3}
.droga{fill:none;stroke:#8d6e4f;stroke-width:1.2}
.ciek{fill:none;stroke:#3a8fd0;stroke-width:1.2}
.sel{fill:none;stroke:#ff00c8;stroke-width:4}
/* punkty graniczne (gr_pkt): kropka stałej wielkości na ekranie = odcinek zerowej długości z okrągłym końcem */
.gr{fill:none;stroke-linecap:round}
.gr-t{stroke:#6b3fa8;stroke-width:10}
.gr-n{stroke:#6b3fa8;stroke-width:10}.gr-n2{stroke:#fff;stroke-width:5}
.gr-wyb{stroke:#ff00c8;stroke-width:18}
.lab-g{fill:#4a2380;font-weight:600}
/* pomiar (pomarańczowy, przerywany), zapisane obiekty (rdzawy), warstwy z plików (kolor warstwy z atrybutu style grupy) */
.mi-l{fill:none;stroke:#e8590c;stroke-width:3;stroke-dasharray:9 6}
.mi-p{fill:#e8590c;fill-opacity:.16;stroke:none}
.mi-v{fill:none;stroke:#e8590c;stroke-width:13;stroke-linecap:round}
.mi-v2{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
/* moje obiekty: jaskrawa limonka z ciemną obwódką pod spodem, żeby było je widać i na jasnym podkładzie, i na zabiegach (5.11) */
.mo-c{fill:none;stroke:#1f3d00;stroke-width:6.5;stroke-linejoin:round;stroke-linecap:round}
.mo-l{fill:none;stroke:#a6ff00;stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.mo-p{fill:#a6ff00;fill-opacity:.35;stroke:#a6ff00;stroke-width:3.4;stroke-linejoin:round}
.mo-k{fill:none;stroke:#1f3d00;stroke-width:8;stroke-linecap:round}   /* mniejsze niż kamienie (10 px), leśniczy 5.11; trafienie palcem dalej 16 px */
.mo-k2{fill:none;stroke:#a6ff00;stroke-width:5;stroke-linecap:round}
.wa-p{fill-opacity:.14;stroke-width:2}
.wa-l{fill:none;stroke-width:2.4}
.wa-k{fill:none;stroke-width:11;stroke-linecap:round}
.wa-k2{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round}
.lab-m{fill:#1f4d00;font-weight:700}
/* warstwy z paczki (5.11): siedliska pod wydzieleniami, ochrona nad nimi, drogi z białą obwódką */
.pz-s{fill-opacity:.62;stroke:#fff;stroke-width:.5}
.pz-o{fill-opacity:.16;stroke-width:2;stroke-dasharray:7 4}
.pz-o.pz-op{fill-opacity:.2;stroke-dasharray:none;stroke-width:2.4}
.pz-dc{fill:none;stroke:#fff;stroke-width:5.6;stroke-linecap:round;stroke-linejoin:round}
.pz-d{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pz-dp{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pz-pp{fill:none;stroke:#d32f2f;stroke-width:1.6;stroke-dasharray:5 4}
.pz-k{fill:none;stroke-linecap:square}
.pz-s,.pz-o,.pz-dc,.pz-d,.pz-dp,.pz-pp,.pz-k,.sz,.w,.oddz,.les,.droga,.ciek,.sel,.gps-k,.gr,.mi-l,.mi-p,.mi-v,.mi-v2,.mo-c,.mo-l,.mo-p,.mo-k,.mo-k2,.wa-p,.wa-l,.wa-k,.wa-k2{vector-effect:non-scaling-stroke}
.mier{background:var(--card);border:1px solid var(--line);border-left:5px solid #e8590c;border-radius:12px;padding:8px 10px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.mier:empty{display:none}
.mier .wy{font-size:15px;margin:0 0 7px}
.mier .rz{display:flex;gap:6px;flex-wrap:wrap}
.mier .rz button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px;cursor:pointer}
.mier .rz button.on{background:#e8590c;color:#fff;border-color:#e8590c;font-weight:600}
.mier .rz button:disabled{opacity:.4}
#bMier.on{background:#e8590c;color:#fff;border-color:#e8590c}
.pole{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:16px;margin:6px 0 10px}
.wrs{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.wrs input{width:22px;height:22px;flex:none}
.wrs .kw{width:20px;height:20px;cursor:pointer}
.wrs .nz{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrs button{border:0;background:none;cursor:pointer;font-size:18px;padding:4px 6px;color:var(--mute)}
.ok{background:var(--acc-bg);border-radius:8px;padding:8px 12px;margin-top:10px}
.przel{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.przel input{width:22px;height:22px}
.lab{paint-order:stroke;stroke:#fff;stroke-linejoin:round;fill:#222;text-anchor:middle;dominant-baseline:central;font-family:system-ui,sans-serif;pointer-events:none}
.lab-o{font-weight:700}
.lw{transform:scale(var(--vm,1))}
/* pozycja GPS (5.11, v18): mała turkusowa kropka z ciemną obwódką i tętniącym pierścieniem; w ruchu strzałka w kierunku marszu.
   Grupa #gpsG ma skalę = px ekranu, więc wymiary niżej są w pikselach. Turkusu nie ma nigdzie indziej na mapie. */
.gps-a{fill:#00c8e6;fill-opacity:.12;stroke:#0097b2;stroke-opacity:.6}
.gps-p,.gps-s{fill:#00e0ff;stroke:#00303d;stroke-width:1.5;stroke-linejoin:round}
.gps-r{fill:none;stroke:#00c8e6;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:gpsPuls 2s ease-out infinite}
@keyframes gpsPuls{from{transform:scale(.35);opacity:.95}to{transform:scale(1);opacity:0}}
/* sterowanie */
.gora{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
.gora>*{pointer-events:auto}
.pill{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 6px;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer;font-weight:600;font-size:12px;line-height:1.3;white-space:nowrap}
.rok{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.rok button{border:0;background:none;padding:3px 6px;font-size:13px;line-height:1;cursor:pointer}
.rok select{border:0;background:none;font-weight:700;font-size:12px;padding:3px 0;appearance:none;-webkit-appearance:none;text-align:center}
.sp{flex:1}
.prawo{position:fixed;right:8px;top:calc(40px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;z-index:5}
.prawo button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:13px;line-height:1;cursor:pointer;padding:0}
#bGps.on{background:#0097b2;color:#fff;border-color:#0097b2}
#bGps.pol{background:#d6f6fb;color:#00596b;border-color:#0097b2}
.dol{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.dol>*{pointer-events:auto}
.leg{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 9px;box-shadow:0 1px 6px rgba(0,0,0,.18);font-size:13px;max-height:30vh;overflow:auto}
.leg:empty{display:none}
.leg .k{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.kw{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.3);flex:none}
.gdzie{background:#1a73e8;color:#fff;border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.25);cursor:pointer}
.gdzie:empty{display:none}
.gdzie.uw{background:#8a4200}
/* prowadź do (5.11, v19): jedna linijka nad paskiem GPS + przerywana linia na mapie, turkus jak wskaźnik GPS */
.cel{display:flex;align-items:center;gap:8px;background:#00596b;color:#fff;border-radius:10px;padding:5px 6px 5px 11px;font-size:14px;box-shadow:0 1px 6px rgba(0,0,0,.25);cursor:pointer}
.cel:empty{display:none}
.cel .st{display:inline-block;font-size:18px;line-height:1;transition:transform .3s}
.cel .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:7px;width:28px;height:28px;font-size:15px;cursor:pointer;flex:none}
.cel-l{fill:none;stroke:#0097b2;stroke-width:2.2;stroke-dasharray:7 5;stroke-linecap:round}
.cel-k{fill:none;stroke:#00303d;stroke-width:13;stroke-linecap:round}.cel-k2{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round}
.cel-l,.cel-k,.cel-k2{vector-effect:non-scaling-stroke}
/* arkusz od dołu (telefon) albo panel z prawej (komputer) */
.ark{position:fixed;left:0;right:0;bottom:0;max-height:78vh;z-index:9;background:var(--card);color:var(--ink);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.25);
  overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s ease-out;overscroll-behavior:contain}
.ark.on{transform:none}
@media (min-width:900px){.ark{left:auto;top:0;width:440px;max-height:none;border-radius:0;transform:translateX(105%)}}
.uchwyt{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 4px;cursor:pointer}
.ark .x{position:sticky;top:0;float:right;border:0;background:var(--card);font-size:26px;line-height:1;cursor:pointer;color:var(--mute);padding:2px 6px;margin-right:-8px}
.ark h2{font-size:20px;margin:4px 0 2px}
.ark h3{font-size:13.5px;margin:16px 0 5px;color:var(--acc);text-transform:uppercase;letter-spacing:.03em}
.ark table{border-collapse:collapse;width:100%;font-size:13px}
.ark th,.ark td{border-bottom:1px solid var(--line);padding:4px 4px;text-align:left;vertical-align:top}
.ark th{color:var(--mute);font-weight:600;font-size:12px}
.ark td.l,.ark th.l{text-align:right;white-space:nowrap}
.ark tr.war td{background:var(--hot);font-weight:600}
.op{color:var(--mute);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--mute)}
.wyr{border-radius:10px;padding:2px 10px 8px;margin:12px -4px}
.wyr-kon{background:#eef4fc;border:1px solid #bcd3ef;border-left:6px solid #3a78c2}
.wyr-kon h3{color:#1f4f8a}
.kon{background:#fff;border:1px solid #d3e1f3;border-left:4px solid #8fb3e0;border-radius:8px;padding:5px 8px;margin:5px 0;font-size:13px}
.kon.uw{border-left-color:#e07b00;background:#fff6ea}
.kon .kon-uw{color:#8a4200;font-weight:600}
.kon .kon-ok{color:#2e6b14}
.kon .ost{font-size:11px;background:#3a78c2;color:#fff;border-radius:5px;padding:0 5px;margin-left:4px}
@media (prefers-color-scheme:dark){
  .wyr-kon{background:#18222f;border-color:#2f4560;border-left-color:#4f8fd8}.wyr-kon h3{color:#9cc2f0}
  .kon{background:#202b38;border-color:#2f4560;border-left-color:#3a5f8f}.kon.uw{background:#33261a;border-left-color:#e07b00}
  .kon .kon-uw{color:#ffb060}.kon .kon-ok{color:#97C459}}
.pd{border:1px solid var(--line);border-left:7px solid var(--line);border-radius:10px;padding:6px 10px;margin:8px 0}
.pd-g{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.pd-s{margin-left:auto;font-size:12.5px;color:var(--mute)}
.pd-l{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:2px}
.pd-n{font-size:30px;font-weight:700;line-height:1.05}
.pd-j{font-size:18px;font-weight:600;color:var(--mute)}
.pd-p{font-size:34px;font-weight:800;line-height:1;color:var(--acc)}
.pd-p.pd-ok{color:#2e6b14}
@media (prefers-color-scheme:dark){.pd-p.pd-ok{color:#97C459}}
.rokpoz{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rokpoz span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
/* panel zabiegów */
.dz{margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.dz b{font-size:14px}
.dz button{margin-left:auto;border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:4px}
.cz{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 10px;margin:5px 0;cursor:pointer}
.cz.on{border-color:var(--acc);background:var(--acc-bg)}
.cz .kw{width:18px;height:18px}
.cz .kw.pusty{background:transparent!important;border-style:dashed}
.cz .n{margin-left:auto;color:var(--mute);font-size:12.5px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.szuk{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:16px}
.wyn{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;cursor:pointer}
</style>

<script>
// ---- wspólne z mapą przenośną (mapa-przenosna.html, stan z 16.10.2026): czytniki, model, karta wydzielenia ----
'use strict';
const KOLCZYN = '';   // leśnictwo z paczki: najczęstszy adres w f_arodes
const NAZWY_LESN = {};   // nazwa z paczki (f_forest_range)
let LESN = KOLCZYN;
const DZIALY = {POZ:'Użytkowanie', HOD:'Hodowla', OCHRL:'Ochrona lasu', OCHRP:'Ochrona ppoż.', OCHRPR:'Ochrona przyrody', UTRZ:'Utrzymanie', UBOCP:'Uboczne'};
// nazwy czynności — te same co w kokpicie (pewne wg wiki/pojecia/adres-lesny-i-kody.md, „?” = niepewne)
const NAZWY = {TWP:'trzebież wczesna', TPP:'trzebież późna', IB:'rębnia zupełna', IIIA:'rębnia częściowa',
  CP:'czyszczenia późne', CW:'czyszczenia wczesne', PIEL:'pielęgnacja upraw', 'MA-PORZ':'porządkowanie powierzchni',
  'O-PROGNŚ':'jesienne poszukiwania', 'O-PROGNF':'pułapki feromonowe', 'O-PROGND':'poszukiwania na drzewach próbnych',
  'ODN-GLEB':'przygotowanie gleby (orka)', 'NAT-WPG':'przygotowanie gleby pod odnowienie naturalne',
  'ODN-POR':'odnowienie sztuczne (?)', POPR:'poprawki', 'O-GRODZN':'grodzenie upraw – nowe',
  'O-GRODZS':'konserwacja grodzeń', 'O-GRODZR':'rozbiórka grodzeń', 'O-ZGRYZD':'drzewa zgryzowe',
  'O-REMIZSR':'prace przy remizie (?)', 'P-PORZ':'porządkowanie ppoż.', 'P-PASYS':'odnowienie pasów ppoż. (?)',
  'OP-BUDKIS':'czyszczenie budek lęgowych'};
// kolory czynności: nasycone i od siebie dalekie (leśniczy 8.10: „bardziej wyraźne”), rozróżnialne także na wydruku;
// kolejność tak, żeby pierwsze wybrane czynności dostały najbardziej odmienne barwy
const PALETA = ['#e6194b','#1f5fe0','#2ca02c','#ff7f0e','#9b1fc2','#00a6c7','#e8c500','#d61fa8','#8b4a14','#0b2a8a','#7fbf00','#7a0019'];
const GATUNKI = {SO:'#e9c46a', SOS:'#e9c46a', DB:'#9c6644', BK:'#6a994e', BRZ:'#9ad1d4', MD:'#2a9d8f', LP:'#f4a261', OL:'#457b9d', OS:'#b8b8ff', GB:'#90a955', JW:'#cb997e', KL:'#e76f51', JS:'#bc6c25', DG:'#386641', SW:'#52796f'};
const SKALE = [1000,2000,2500,3000,4000,5000,6000,7500,10000,12500,15000,20000,25000,30000,40000,50000,60000,75000,100000];
const NAPISY = [2.1, 2.6, 3.2];   // mm na papierze: małe / średnie / duże
const HEAD = 14, FOOT = 11;

// ---- pomocnicze ----------------------------------------------------------------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = v => (v == null || v instanceof Uint8Array) ? '' : String(v).trim();
const D = v => (typeof v === 'number') ? v : (v == null || v === '' ? 0 : (parseFloat(v) || 0));
const fn = (n, d = 0) => Number(n || 0).toLocaleString('pl-PL', {minimumFractionDigits:d, maximumFractionDigits:d});
const nat = (a, b) => String(a).localeCompare(String(b), 'pl', {numeric:true});
function jedn(u){ const x = S(u).toUpperCase(); return ({HA:'ha', M3:'m³', SZT:'szt.', KM:'km', KMTR:'km', MB:'mb', H:'h'})[x] || x.toLowerCase(); }
// klucz adresu: bez spacji, bez końcowego -00 i pustych członów: „10-01-1-01-12 -a -00” → „10-01-1-01-12-a”
const klucz = a => S(a).replace(/\s/g, '').replace(/-00$/, '').replace(/-+$/, '');
function krotki(a){
  let k = klucz(a);
  if (k === LESN) return 'całe leśnictwo';
  if (k.startsWith(LESN + '-')) k = k.slice(LESN.length + 1);
  const p = k.split('-').filter(Boolean);

// ---- ZIP: wyjęcie jednego pliku (deflate przez DecompressionStream przeglądarki) -------
async function zipWyjmij(buf, re){

          el = dv.getUint16(o + 30, true), cl = dv.getUint16(o + 32, true), lo = dv.getUint32(o + 42, true);
    const name = td.decode(b.subarray(o + 46, o + 46 + nl));

      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      const data = b.subarray(start, start + cs);
      zipWyjmij.nazwa = name;
      if (m === 0) return data;
      if (m !== 8) throw new Error('Nieznana metoda kompresji w ZIP-ie (' + m + ').');
      if (typeof DecompressionStream === 'undefined') throw new Error('Ta przeglądarka nie umie rozpakować ZIP-a. Potrzebna nowsza (Chrome/Edge 103+, Firefox 113+).');
      const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return new Uint8Array(out);
    }
    o += 46 + nl + el + cl;
  }
  return null;
}

function czytajDbf(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

// ---- model z SILP.db --------------------------------------------------------------------
function zbuduj(db){
  const T = db.tables();
  for (const t of ['f_object_measures','f_plan_activity','f_arodes']) if (!(t in T)) throw new Error('W SILP.db brakuje tabeli ' + t + '.');
  const adr = {}; for (const r of db.table(T.f_arodes)) adr[r[0]] = S(r[2]);
  const ile = {};
  for (const a of Object.values(adr)){ const k = /^(\d+-\d+-\d+-\d+)-/.exec(a.replace(/\s/g, '')); if (k) ile[k[1]] = (ile[k[1]] || 0) + 1; }
  const kody = Object.entries(ile).sort((a, b) => b[1] - a[1]);
  if (kody.length) LESN = kody[0][0];
  let nazwa = NAZWY_LESN[LESN] || '';
  if (T.f_forest_range){ const w = db.table(T.f_forest_range).find(r => klucz(r[4]) === LESN); if (w && S(w[3])) nazwa = S(w[3]); }
  // pozycje planu: [2] plan_pos, [3] rok, [4] dział, [5] czynność, [9] object_ref → f_arodes
  const poz = {};
  for (const r of db.table(T.f_object_measures)){
    const cz = S(r[5]); if (!cz || cz.startsWith('VAT-')) continue;
    poz[r[2]] = {nr:String(r[2]), rok:D(r[3]), typ:S(r[4]), cz, adr:klucz(adr[r[9]]), ilP:0, ilW:0, jedn:'', mP:0, mW:0};
  }
  for (const r of db.table(T.f_plan_activity)){
    const p = poz[r[3]]; if (!p || S(r[11]) !== 'T') continue;
    const tag = S(r[13]), il = D(r[8]);
    if (tag === 'R') p.ilP += il; else if (tag === 'M') p.ilW += il;
    if (!p.jedn) p.jedn = jedn(r[7]);
  }
  if (T.f_plan_goal) for (const r of db.table(T.f_plan_goal)){
    const p = poz[r[3]]; if (!p) continue;
    const tag = S(r[8]), q = D(r[6]);
    if (tag === 'R') p.mP += q; else if (tag === 'M') p.mW += q;
  }
  const st = stosy(db, T, adr);
  // pozyskanie: wykonanie = większe z wpisu SILP i stosów odebranych (SILP dopisuje z opóźnieniem — jak w kokpicie)
  for (const p of Object.values(poz)) if (p.typ === 'POZ' && st.odeb[p.nr] > p.mW) p.mW = st.odeb[p.nr];
  const lata = [...new Set(Object.values(poz).map(p => p.rok))].filter(x => x > 0).sort();
  const natDic = {}; for (const o of db.obiekty('f_prot_site_dic')) natDic[S(o.prot_site_cd)] = S(o.prot_site_name);
  const bezpiecznie = (f, zast) => { try { return f(); } catch (e) { console.warn(e); return zast; } };
  return {lesn:LESN, nazwa, poz:Object.values(poz), lata, stosy:st.lista, szk:szkice(db, T, adr), tax:taksacja(db, adr), natDic,
    szac:bezpiecznie(() => szacunki(db), []), kontr:bezpiecznie(() => kontrole(db, Object.values(poz)), {})};
}
// szacunki brakarskie (pomysł kolegi, 16.10): ac_lok = szacunek na wydzieleniu (adres, rok, czynność, typ),
// ac_opispow = opis (pow_man w arach, nr raptularza, daty, uwaga), ac_masy2 = masa m³ wg gatunku, sortymentu i klasy grubości,
// ac_swsp → ac_skl = pomiar drzew z raptularza (stopień grubości, liczba drzew w klasach, wysokości) — w paczce tylko dla części szacunków
function szacunki(db){
  const lok = db.obiekty('ac_lok'); if (!lok.length) return [];
  const op = {}; for (const o of db.obiekty('ac_opispow')) op[o.lok] = o;
  const ms = {}; for (const o of db.obiekty('ac_masy2')) (ms[o.lok] = ms[o.lok] || []).push(o);
  const gat = {}; for (const o of db.obiekty('ac_swsp')) gat[o.gat_int_num] = o;
  const rp = {}; for (const o of db.obiekty('ac_skl')){ const g = gat[o.gat_int_num]; if (g) (rp[g.lok] = rp[g.lok] || []).push(Object.assign({gat:S(g.gat_kod)}, o)); }
  return lok.map(l => {
    const o = op[l.lok] || {}, m = ms[l.lok] || [];
    return {lok:l.lok, adr:klucz(l.adres), rok:D(l.rok), cz:S(l.gr_czynn), typ:S(l.typ_szac), pow:D(o.pow_man) / 100, rapt:S(o.nr_rapt),
      dw:S(o.dat_wprow).slice(0, 10), dk:S(o.dat_kor).slice(0, 10), uw:S(o.uwaga), masa:m.reduce((t, x) => t + D(x.masa), 0), masy:m, pomiar:rp[l.lok] || []};
  }).sort((a, b) => b.rok - a.rok || nat(a.adr, b.adr));
}
// kontrole: f_plan_inspection (pozycja planu, data, uwaga) + f_inout (protokół: numer, kto, data);
// pełnej treści protokołu w paczce nie ma, jest numer i krótka uwaga (do ~100 znaków)
const imie = s => S(s).toLowerCase().replace(/(^|[\s-])\S/g, c => c.toUpperCase());
function kontrole(db, poz){
  const pr = {}; for (const o of db.obiekty('f_inout')) pr[o.prot_int_num] = o;
  const nr = {}; for (const p of poz) nr[p.nr] = p;
  const out = {};
  for (const o of db.obiekty('f_plan_inspection')){
    const p = nr[String(o.plan_pos)], r = pr[o.prot_int_num] || {};
    (out[p ? p.adr : '?'] = out[p ? p.adr : '?'] || []).push({d:S(o.insp_date).slice(0, 10), uw:S(o.insp_desc), nr:S(r.prot_desc), rodz:S(r.change_cd),
      kto:[imie(r.prot_name_2), imie(r.prot_name_1)].join(' ').trim(), kto2:[imie(r.check_name_2), imie(r.check_name_1)].join(' ').trim(), poz:p || null, pp:o.plan_pos});
  }
  for (const l of Object.values(out)) l.sort((a, b) => b.d.localeCompare(a.d));
  return out;
}
// opis taksacyjny z SILP.db wg wydzielenia (klucz adresu); tabele i pola: wiki/zrodla/mlas-paczka-lesnictwa.md.
// f_storey_species.volume to zasobność w m³/ha brutto (sprawdzone 16.10 wobec szacunków brakarskich ac_masy2 z rębni 2026)
function taksacja(db, adr){
  const T = {};
  const grupuj = (tab, pole) => {
    let w = []; try { w = db.obiekty(tab); } catch (e) { console.warn(tab, e); }
    for (const o of w){ const a = adr[o.arodes_int_num]; if (!a) continue; const k = klucz(a); ((T[k] = T[k] || {})[pole] = T[k][pole] || []).push(o); }
  };
  [['f_subarea', 'sub'], ['f_arod_storey', 'war'], ['f_storey_species', 'gat'], ['f_arod_cue', 'wsk'], ['f_arod_goal', 'cel'], ['f_arod_stand_pec', 'cech'],
   ['f_arod_category', 'kat'], ['f_arod_spec_area', 'pw'], ['f_species_sparea', 'pwg'], ['f_arod_phenomena', 'osob'], ['f_arod_prot_site', 'nat'],
   ['vg_set_protect', 'fo'], ['mli_measures', 'hist']].forEach(([t, p]) => grupuj(t, p));
  return T;
}
// stosy: numer jak w SILP z sub_stock_nr (kokpit, 8.10), sztuka liczona raz (najnowsza wersja W/S),
// miejsce z c_wood_coord: [1] wykaz, [2] sub_stock_nr, [3] „latitude” = Y PL-1992, [4] „longitude” = X PL-1992
function stosy(db, T, adr){
  const wyn = {lista:[], odeb:{}};
  if (!T.c_wood_head || !T.c_wood_pos) return wyn;
  const hd = {}; for (const r of db.table(T.c_wood_head)) hd[S(r[2])] = {d:S(r[17]).slice(0, 10), a:r[18], p:S(r[11])};
  const xy = {};
  if (T.c_wood_coord) for (const r of db.table(T.c_wood_coord)){
    const n = D(r[3]), e = D(r[4]); if (!(n > 0 && e > 0)) continue;
    xy[S(r[2])] = [e, n]; if (!xy['W|' + S(r[1])]) xy['W|' + S(r[1])] = [e, n];
  }
  const szt = {};
  for (const r of db.table(T.c_wood_pos)){
    const h = hd[S(r[1])]; if (!h || h.d.length < 10) continue;
    const k = S(r[2]) || S(r[1]) + '|' + S(r[3]), wer = h.d + (S(r[1])[0] === 'S' ? '1' : '0');
    const nowa = {wer, nr:S(r[1]), a:h.a, q:D(r[8]), b:D(r[7]), srt:S(r[20]) || '?', gat:S(r[4]), dl:D(r[5]), pp:h.p};
    const s = szt[k];
    if (!s){ szt[k] = Object.assign(nowa, {pierw:h.d}); continue; }
    if (h.d < s.pierw) s.pierw = h.d;
    if (wer > s.wer) Object.assign(s, nowa);
  }
  const nrStosu = k => /^\d{8}$/.test(k) ? k.slice(2, 7).replace(/^0/, '') : k;
  const st = {};
  for (const [kSt, s] of Object.entries(szt)){
    if (s.pp) wyn.odeb[s.pp] = (wyn.odeb[s.pp] || 0) + s.b;
    const nr = nrStosu(kSt), kg = s.nr.slice(1, 3) + '|' + nr;
    const g = st[kg] || (st[kg] = {nr, wyk:s.nr, adr:klucz(adr[s.a]), stan:0, m:0, dat:s.pierw, k:{}, gat:{}, xy:null});
    g.stan += Math.max(0, s.q); g.m += s.b; if (s.pierw < g.dat) g.dat = s.pierw;
    g.k[s.srt] = (g.k[s.srt] || 0) + s.b; if (s.gat) g.gat[s.gat] = 1;

  }
  wyn.lista = Object.values(st).map(g => ({nr:g.nr, wyk:g.wyk, adr:g.adr, stan:Math.round(g.stan * 100) / 100, m:Math.round(g.m * 100) / 100,
    dat:g.dat, srt:Object.keys(g.k).sort((a, b) => g.k[b] - g.k[a]), gat:Object.keys(g.gat).join(', '), xy:g.xy})).sort((a, b) => nat(a.nr, b.nr));
  return wyn;

// ---- WGS84 → PL-1992 (EPSG:2180): odwzorowanie Gaussa-Krügera, szereg Krügera do n^4 (dokładność poniżej mm) ----
function do1992(lat, lon){
  const a = 6378137, f = 1 / 298.257222101, n = f / (2 - f), e = Math.sqrt(f * (2 - f)), k0 = 0.9993;
  const A = a / (1 + n) * (1 + n * n / 4 + n ** 4 / 64);
  const al = [n / 2 - 2 * n * n / 3 + 5 * n ** 3 / 16 + 41 * n ** 4 / 180, 13 * n * n / 48 - 3 * n ** 3 / 5 + 557 * n ** 4 / 1440, 61 * n ** 3 / 240 - 103 * n ** 4 / 140, 49561 * n ** 4 / 161280];
  const fi = lat * Math.PI / 180, dl = (lon - 19) * Math.PI / 180;
  const t = Math.sinh(Math.atanh(Math.sin(fi)) - e * Math.atanh(e * Math.sin(fi)));
  const xi = Math.atan2(t, Math.cos(dl)), eta = Math.atanh(Math.sin(dl) / Math.sqrt(1 + t * t));
  let X = xi, Y = eta;
  for (let j = 1; j <= 4; j++){ X += al[j - 1] * Math.sin(2 * j * xi) * Math.cosh(2 * j * eta); Y += al[j - 1] * Math.cos(2 * j * xi) * Math.sinh(2 * j * eta); }
  return [500000 + k0 * A * Y, -5300000 + k0 * A * X];   // [wschód (x w SHP), północ (y w SHP)]
}

    const buf = await file.arrayBuffer();
    const dbB = await zipWyjmij(buf, new RegExp('(^|/)' + KOLCZYN + '/SILP\\.db$')) || await zipWyjmij(buf, /(^|\/)SILP\.db$/);
    if (!dbB) throw new Error('W tym ZIP-ie nie ma pliku SILP.db. Czy to paczka mLasa?');
    const folder = zipWyjmij.nazwa.replace(/SILP\.db$/, '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    M = zbuduj(new Sqlite(dbB));
    const L = async n => {
      const sh = await zipWyjmij(buf, new RegExp('^' + folder + n + '\\.shp$', 'i')), db = await zipWyjmij(buf, new RegExp('^' + folder + n + '\\.dbf$', 'i'));
      if (!sh || !db) return [];
      const g = czytajShp(sh), a = czytajDbf(db);
      return przygotuj(g.map((x, i) => ({g:x, a:a[i] || {}})).filter(f => f.g && !f.a._usun && !(f.g.rings && !f.g.rings.length)));   // puste szkice z mLasa (5.11) wywracały wczytanie
    };
    const [wydz, oddz, les, drogi, cieki, grp, szPol, szLin, szPkt, szPnsw, pSied, pOcp, pOprz, pDroga, pPpoz, pInfra] = await Promise.all(['wydz_pol', 'oddz_pol', 'les_pol', 'kom_lin', 'ciek_lin', 'gr_pkt', 'szkic_pol', 'szkic_lin', 'szkic_pkt', 'szkic_pnsw',
      'sied_pol', 'ocp_pol', 'oprz_pol', 'g_droga', 'komp_lin', 'g_obinfr'].map(L));
    if (!wydz.length) throw new Error('W paczce nie ma warstwy wydzieleń (wydz_pol). Potrzebny pełny ZIP z mLasa.');
    G = {wydz:[], oddz:[], les, drogi, cieki, W:new Map(), O:new Map()};
    for (const f of wydz){
      f.k = klucz(f.a.adr_les);
      if (f.k.startsWith(LESN + '-')){ const p = f.k.slice(LESN.length + 1).split('-'); f.lit = p.slice(1).join(' '); f.odd = p[0]; G.wydz.push(f); G.W.set(f.k, f); }
    }
    for (const f of oddz){ f.k = klucz(f.a.adr_les); if (f.k.startsWith(LESN + '-')){ f.odd = f.k.slice(LESN.length + 1); G.oddz.push(f); G.O.set(f.k, f); } }
    G.les = les.filter(f => klucz(f.a.adr_les) === LESN);
    G.bb = bbox(G.wydz);
    // warstwy z paczki do włączania w ☰ (5.11); pk = skąd obiekt, do karty i kolorów
    const tag = (l, pk, t) => l.filter(f => f.g.t === t && f.bb[2] >= G.bb[0] && f.bb[0] <= G.bb[2] && f.bb[3] >= G.bb[1] && f.bb[1] <= G.bb[3]).map(f => (f.pk = pk, f));
    G.pz = {sied:tag(pSied, 'sied', 'pol'), ochr:[...tag(pOprz, 'oprz', 'pol'), ...tag(pOcp, 'ocp', 'pol')], drogi:tag(pDroga, 'droga', 'lin'),
      ppoz:tag(pPpoz, 'ppoz', 'lin'), infra:tag(pInfra, 'infra', 'pkt').filter(f => INFRA[T(f.a.kod_ob)])};
    // punkty graniczne: nr_gran, stab T = zastabilizowany (kamień, słupek), N = bez stabilizacji; klasa i osnowa w paczce bywają puste
    G.gr = grp.filter(f => f.g.t === 'pkt' && f.x > G.bb[0] - 300 && f.x < G.bb[2] + 300 && f.y > G.bb[1] - 300 && f.y < G.bb[3] + 300)
      .map(f => ({x:f.x, y:f.y, nr:S(f.a.nr_gran), stab:S(f.a.stab) === 'T', klasa:f.a.klasa, osnowa:S(f.a.osnowa), wys:D(f.a.wys)}));
    for (const sid in M.szk) M.szk[sid].geo = [];
    // szkic_pnsw: biogrupy, kępy, gniazda, luki; kod_ob dorabiamy jak na mapie przenośnej
    for (const f of szPnsw) f.a.kod_ob = 'PNSW';
    for (const f of [...szPol, ...szPnsw, ...szLin, ...szPkt]){ const s = M.szk[f.a.id_szkic]; if (s) s.geo.push(f); }
    let data = new Date(file.lastModified);
    const mm = /_(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\d{2}/.exec(file.name);
    if (mm) data = new Date(2000 + +mm[1], +mm[2] - 1, +mm[3], +mm[4], +mm[5]);
    M.meta = {plik:file.name, data};
    // ustawienia: zapamiętany rok i czynności z ostatniego razu; bez zapisu — mapa bez kolorów (leśniczy 3.11);
    // widok zawsze na całe leśnictwo
    const u = wczytajUst(), rokTeraz = new Date().getFullYear();
    ST.rok = u && M.lata.includes(u.rok) ? u.rok : M.lata.includes(rokTeraz) ? rokTeraz : (M.lata[M.lata.length - 1] || 0);
    ST.status = u && u.status || 'all';
    if (u && typeof u.gr === 'boolean') ST.gr = u.gr;
    if (u && typeof u.grNr === 'boolean') ST.grNr = u.grNr;
    if (u && typeof u.moje === 'boolean') ST.moje = u.moje;
    if (u && typeof u.zew === 'boolean') ST.zew = u.zew;
    ST.szk = new Set((u && Array.isArray(u.szk) ? u.szk : []).filter(id => M.szk[id]));
    ST.pz = new Set((u && Array.isArray(u.pz) ? u.pz : []).filter(id => PACZ.some(p => p.id === id)));
    ST.cz.clear();
    if (u && Array.isArray(u.cz)) u.cz.forEach((c, i) => ST.cz.set(c, i));
    budujUklad();
    if (zapamietaj){
      try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); await idbPut('zip', {nazwa:file.name, mod:file.lastModified, blob:new Blob([buf])}); }
      catch (e) { console.warn('Nie zapamiętano paczki', e); }
    }
  } catch (e) {
    console.error(e);
    ekranStartowy('Nie udało się wczytać: ' + (e && e.message ? e.message : e));
  }
}
function bbox(feats){
  const b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const f of feats){ const q = f.bb; b[0] = Math.min(b[0], q[0]); b[1] = Math.min(b[1], q[1]); b[2] = Math.max(b[2], q[2]); b[3] = Math.max(b[3], q[3]); }
  return b;
}

// ---- kolorowanie zabiegów roku -----------------------------------------------------------
// wykonane = pełny kolor, do wykonania = blady z obwódką; przy kilku czynnościach na wydzieleniu kolor bierze pierwsza wybrana
function pozRoku(){ return M.poz.filter(p => p.rok === ST.rok); }
function wybrane(){
  const out = new Map();
  for (const p of pozRoku()){
    if (!ST.cz.has(p.cz)) continue;
    const s = stanPoz(p); if (ST.status !== 'all' && s !== ST.status) continue;
    if (!out.has(p.adr)) out.set(p.adr, []); out.get(p.adr).push(p);
  }
  return out;
}
function koloruj(){
  const wyb = wybrane();
  for (const f of G.wydz){
    const l = wyb.get(f.k);
    if (!l){ f.el.setAttribute('class', 'w'); f.el.style.fill = ''; f.el.style.stroke = ''; continue; }
    l.sort((a, b) => ST.cz.get(a.cz) - ST.cz.get(b.cz));
    const kol = kolorCz(l[0].cz), wyk = l.some(p => stanPoz(p) === 'wyk');
    f.el.setAttribute('class', 'w ' + (wyk ? 'wyk' : 'plan'));
    f.el.style.fill = kol; f.el.style.stroke = wyk ? '' : kol;
  }
  legenda(wyb);
}
// podpowiedzi na dolnym pasku (5.11, v19): tylko przy pierwszych 3 uruchomieniach mapy, potem pasek pokazuje same kolory
const PODP = (() => { try { const n = +(localStorage.getItem('mapa-teren-podp') || 0) + 1; localStorage.setItem('mapa-teren-podp', n); return n <= 3; } catch (e) { return true; } })();
function legenda(wyb){
  const el = document.getElementById('leg'), ile = {};
  let pozaMapa = 0;
  for (const [k, l] of wyb){ if (!G.W.has(k)) pozaMapa += l.length; for (const p of l) ile[p.cz] = (ile[p.cz] || 0) + 1; }
  const cz = [...ST.cz.keys()].filter(c => ile[c]).sort((a, b) => ST.cz.get(a) - ST.cz.get(b));
  document.getElementById('ileCz').textContent = ST.cz.size ? '(' + ST.cz.size + ')' : '';
  el.innerHTML = cz.length
    ? cz.map(c => `<span class='k'><span class='kw' style='background:${kolorCz(c)}'></span><b>${esc(c)}</b> ${ile[c]}</span>`).join('') +
      (PODP ? `<span class='op'>· pełny = wykonane, blady = do wykonania${pozaMapa ? ` · ${pozaMapa} poz. na całe oddziały/leśnictwo` : ''}</span>` : '')
    : ST.cz.size ? `<span class='op'>W ${ST.rok} brak wybranych zabiegów.</span>` : PODP ? `<span class='op'>Dotknij „Zabiegi”, żeby pokolorować mapę.</span>` : '';
  el.innerHTML += legSzk() + legPacz();
}
function ustawRok(r){ ST.rok = r; const s = document.getElementById('rok'); if (s) s.value = r; koloruj(); zapiszUst(); if (ARK === 'zab') panelZabiegi(); if (ARK === 'karta') rysujKarte(); }
function rokKrok(d){ const i = M.lata.indexOf(ST.rok) + d; if (i >= 0 && i < M.lata.length) ustawRok(M.lata[i]); }
function wolnyKolor(){ const z = new Set(ST.cz.values()); let i = 0; while (z.has(i)) i++; return i; }
function przelCz(c){ if (ST.cz.has(c)) ST.cz.delete(c); else ST.cz.set(c, wolnyKolor()); koloruj(); zapiszUst(); panelZabiegi(); }
function przelDzial(typ){
  const kody = [...new Set(pozRoku().filter(p => p.typ === typ).map(p => p.cz))].sort(nat);
  const wszystkie = kody.every(c => ST.cz.has(c));
  for (const c of kody){ if (wszystkie) ST.cz.delete(c); else if (!ST.cz.has(c)) ST.cz.set(c, wolnyKolor()); }
  koloruj(); zapiszUst(); panelZabiegi();
}
function ustawStatus(s){ ST.status = s; koloruj(); zapiszUst(); panelZabiegi(); }
function wyczysc(){ ST.cz.clear(); koloruj(); zapiszUst(); panelZabiegi(); }

}

// rozrzut (5.11, v20): przy odbiorniku liczba „dokładności” z Androida nic nie mówi o RTK, więc mapa mierzy, jak skaczą
// pozycje na postoju z ostatnich 10 s (odchylenie średniokwadratowe od średniej). Fix RTK: 1–3 cm, float: dziesiątki cm, bez poprawek: metry.

const ROZ_FIX = .04, ROZ_FLOAT = .5;

// układ rozpoznaję po liczbach: stopnie → WGS84; ok. 150–900 tys. → PL-1992; miliony z cyfrą strefy 5–8 → PL-2000
function doUkladu(w){
  const r0 = w.f.find(f => f.r.length && f.r[0].length >= 2); if (!r0) return w;

  else { const s = Math.floor(x / 1e6); if (s >= 5 && s <= 8 && y > 5e6 && y < 6.2e6){ const U = u2000(s); zm = (a, b) => { const [la, lo] = tmOd(a, b, U); return do1992(la, lo); }; } }
  if (!zm) throw new Error(`${w.nazwa}: nie rozpoznaję układu współrzędnych (pierwszy punkt ${x}; ${y}). Obsługuję WGS84, PL-1992 i PL-2000.`);

async function importuj(pliki){
  try {
    const nowe = [], luz = {};

      if (roz === 'zip' || roz === 'kmz'){
        const nz = zipNazwy(buf);
        if (nz.some(n => /(^|\/)SILP\.db$/i.test(n))) throw new Error(`${p.name} to paczka mLasa. Wczytuje się ją przyciskiem „Wczytaj inną paczkę”, nie jako warstwę.`);
        const czesc = async (baza, e) => { const k = nz.find(m => m.toLowerCase() === (baza + e).toLowerCase()); return k ? zipPlik(buf, k) : null; };
        for (const n of nz.filter(n => /\.shp$/i.test(n))){ const b = n.slice(0, -4); nowe.push(zShp(await zipPlik(buf, n), await czesc(b, '.dbf'), await czesc(b, '.cpg'), bezRoz(n))); }

      else if (roz === 'geojson' || roz === 'json') nowe.push(zGeojson(JSON.parse(tekst(u8)), bezRoz(p.name)));
      else if (['shp', 'dbf', 'cpg', 'prj', 'shx', 'qmd', 'sbn', 'sbx'].includes(roz)) (luz[bezRoz(p.name)] = luz[bezRoz(p.name)] || {})[roz] = u8;

    for (const w of dobre){

// ---- tryb offline: na stronie https pliki strony zostają w telefonie (sw.js); paczka i tak jest tylko lokalna ----
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
  // nowa wersja (5.11, v19): gdy świeżo pobrany sw.js przejmie stronę, przeładuj raz — koniec z „otwórz dwa razy”.
  // Pierwsza instalacja (brak poprzedniego) nie przeładowuje; w trakcie pomiaru też nie, żeby nie zgubić punktów.
  const bylSw = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!bylSw || window.PRZEL) return;
